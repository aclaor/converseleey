<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 Days — The Practice Room</title>
<meta name="description" content="One communication scenario a day for 28 days. Say your answer out loud and get measured feedback on fillers, pace, hedging and sentence length.">
<meta name="theme-color" content="#0C6E75">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 96px; display:grid; grid-template-columns:186px 1fr; gap:44px; align-items:start}
.shell > *{min-width:0}
@media(max-width:900px){ .shell{grid-template-columns:minmax(0,1fr); gap:0} }
@media(max-width:560px){ .shell{padding:0 16px 72px} }

/* rail */
.rail{position:sticky; top:70px; padding-top:30px}
.rail-wk{margin-bottom:18px}
.rail-wk > .mono{color:var(--ink-3); display:block; margin-bottom:9px}
.rail-days{display:flex; flex-direction:column; gap:1px}
.rd{display:flex; align-items:center; gap:11px; padding:5px 7px; border-radius:7px; width:100%; text-align:left; transition:background .14s}
.rd:hover{background:var(--surface-2)}
.rd .pip{flex:none; width:11px; height:11px; border-radius:50%; border:1.5px solid var(--line); background:var(--ground); transition:all .18s}
.rd.done .pip{background:var(--accent); border-color:var(--accent)}
.rd.now .pip{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.rd .lbl{font-size:.83rem; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rd.now .lbl{color:var(--ink); font-weight:600}
.rd.done .lbl{color:var(--ink-2)}
@media(max-width:900px){
  .rail{position:static; padding:14px 0 4px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px}
  .rail-inner{display:flex; gap:18px; min-width:min-content; padding:0 4px}
  .rail-wk{margin:0}
  .rail-days{flex-direction:row; gap:4px}
  .rd{flex-direction:column; gap:5px; padding:5px 2px; width:auto; min-width:26px}
  .rd .lbl{display:none}
  .rd::after{content:attr(data-n); font-family:var(--mono); font-size:.62rem; font-weight:600; color:var(--ink-3)}
  .rd.now::after{color:var(--accent)}
}

/* day */
.day{padding-top:30px}
.day-head{display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin-bottom:12px}
.daynum{color:var(--ink-3)}
.day h1{font-size:clamp(2rem,5.4vw,3rem); line-height:1.03; margin-bottom:4px}
.focusnote{margin-top:14px; font-size:.92rem; color:var(--ink-2); background:var(--accent-soft); border-radius:10px; padding:11px 15px}
.card{margin-top:18px}
.brief{font-size:1.06rem; line-height:1.6}
.tgt{margin-top:16px; padding-top:16px; border-top:1px solid var(--line); display:flex; gap:14px; align-items:flex-start}
.tgt .mono{color:var(--accent); flex:none; padding-top:4px; width:52px}
.tgt p{color:var(--ink-2); font-size:.95rem}
.tips{list-style:none; padding:0; margin:16px 0 0; display:flex; flex-direction:column; gap:8px}
.tips li{display:flex; gap:11px; font-size:.92rem; color:var(--ink-2)}
.tips li::before{content:"—"; color:var(--accent); flex:none}

/* recorder */
.rec{margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.rec-top{padding:20px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.miq{flex:none; width:60px; height:60px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; box-shadow:var(--shadow); transition:transform .14s}
.miq svg{width:24px; height:24px; fill:currentColor}
.miq:hover{transform:scale(1.05)}
.miq.live{background:var(--bad); animation:thump 1.3s ease-in-out infinite}
@keyframes thump{0%,100%{box-shadow:0 0 0 0 rgba(168,60,37,.45)}50%{box-shadow:0 0 0 13px rgba(168,60,37,0)}}
.rec-meta{flex:1; min-width:150px}
.clock{font-family:var(--mono); font-size:1.45rem; font-weight:500; font-variant-numeric:tabular-nums; line-height:1.1}
.clock small{font-size:.7rem; color:var(--ink-3); font-weight:600; letter-spacing:.07em}
.rec-hint{font-size:.86rem; color:var(--ink-3); margin-top:3px}
.lvl{display:flex; align-items:flex-end; gap:2.5px; height:26px; flex:none}
.lvl i{width:3px; background:var(--accent); border-radius:2px; height:3px; transition:height .07s linear}
.ta{width:100%; border:none; border-top:1px solid var(--line); background:var(--inset); color:var(--ink); font-family:var(--sans); font-size:1rem; line-height:1.65; padding:18px 24px; resize:vertical; min-height:126px; display:block}
.ta:focus{outline:none; box-shadow:inset 0 0 0 2px var(--accent)}
.ta::placeholder{color:var(--ink-3)}
.rec-foot{padding:13px 24px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap}
audio{height:38px; max-width:100%}
@media(max-width:560px){ .rec-top,.rec-foot{padding-left:16px; padding-right:16px} .ta{padding-left:16px; padding-right:16px} .lvl{display:none} }

/* results */
.grid{margin-top:18px}
.verdict{margin-top:16px}
.verdict .mono{color:var(--accent); display:block; margin-bottom:9px}
.verdict h3{font-size:1.5rem; line-height:1.2; margin-bottom:9px}
.verdict p{color:var(--ink-2); font-size:.97rem}
.verdict .delta{margin-top:12px; color:var(--ink)}
.tscript{margin-top:16px; background:var(--inset); border:1px solid var(--line); border-radius:12px; padding:19px 22px; font-size:1rem; line-height:1.75; color:var(--ink-2)}
.tscript .mono{display:block; color:var(--ink-3); margin-bottom:10px}

details.model{margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
details.model summary{padding:15px 22px; cursor:pointer; font-weight:600; font-size:.94rem; list-style:none; display:flex; align-items:center; gap:10px}
details.model summary::-webkit-details-marker{display:none}
details.model summary::before{content:"▸"; color:var(--accent); transition:transform .18s}
details.model[open] summary::before{transform:rotate(90deg)}
.mbody{padding:17px 22px 21px; border-top:1px solid var(--line)}
.mbody p{font-family:var(--serif); font-size:1.16rem; line-height:1.55; color:var(--ink)}
.mbody .cap{font-family:var(--sans); font-size:.85rem; color:var(--ink-3); margin-top:13px}

.nav{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap}
.spark{margin-top:32px}
.spark h4{font-size:1.28rem; margin-bottom:2px}
.spark .sub{font-size:.87rem; color:var(--ink-3); margin-bottom:15px}
.spark svg{width:100%; height:86px; display:block}
.disc{font-size:.85rem; color:var(--ink-3); margin-top:32px; padding-top:19px; border-top:1px solid var(--line)}
</style>
</head>
